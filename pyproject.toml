[project]
name = "jwvtscore"
version = "0.1.0"
description = "Privacy-first VirusTotal hash lookup CLI"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Jan Wychowaniak" },
]
requires-python = ">=3.11"
keywords = [
  "cli",
  "hash",
  "malware",
  "security",
  "sha256",
  "virustotal",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Utilities",
]
dependencies = [
  "httpx>=0.27,<0.29",
  "rich>=13.7,<14",
]

[project.urls]
Repository = "https://github.com/janwychowaniak/jwvtscore"

[project.scripts]
jwvtscore = "jwvtscore.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jwvtscore"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src",
]
exclude = [
  "/AGENTS.md",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
files = [
  "src",
  "tests",
]
